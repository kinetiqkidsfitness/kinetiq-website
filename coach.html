<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinetIQ Coach App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#133260">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KinetIQ Coach">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#133260; --blue:#2676BF; --orange:#FF8A3D; --green:#77FF45; --cream:#FFF5EC;
    --ink:#1E2A3A; --muted:#5B6B7C; --white:#FFFFFF; --line:rgba(19,50,96,.1);
    --radius-lg:22px; --radius-md:14px; --maxw:900px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth; color-scheme:light; background:#FFFFFF;}
  body{font-family:'Nunito', system-ui, sans-serif; color:var(--ink); background:var(--cream); min-height:100vh;}
  h1,h2,h3,.display{font-family:'Poppins', system-ui, sans-serif; font-weight:700; color:var(--navy); letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit; cursor:pointer;}
  img,svg{display:block; max-width:100%;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px;}

  header{position:sticky; top:0; z-index:50; background:rgba(255,245,236,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .topbar{display:flex; align-items:center; gap:12px; padding:14px 20px; max-width:var(--maxw); margin:0 auto;}
  .logo{font-family:'Poppins',sans-serif; font-weight:800; font-size:19px; color:var(--navy);}
  .logo span{color:var(--blue);}
  .logo-img{height:26px; width:auto; display:block;}
  .crumb{font-family:'Poppins',sans-serif; font-weight:600; font-size:13.5px; color:var(--muted); display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .crumb button{background:none; border:none; color:var(--blue); font-weight:700; font-family:'Poppins',sans-serif; font-size:13.5px; padding:4px 2px; transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
  .crumb button:active{transform:scale(.92); transition-duration:.1s;}
  .crumb .sep{color:var(--line); opacity:.8;}
  .crumb .current{color:var(--navy);}

  main{padding:22px 0 60px;}
  .eyebrow{font-family:'Poppins', sans-serif; font-weight:600; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--blue); display:inline-flex; align-items:center; gap:7px; margin-bottom:8px;}
  .eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--orange);}
  .page-title{font-size:26px; margin-bottom:6px;}
  .page-sub{color:var(--muted); font-size:15px; margin-bottom:22px; line-height:1.5;}

  /* ---- Module grid ---- */
  .module-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .module-card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px 18px;
    display:flex; flex-direction:column; gap:10px; text-align:left; transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .15s;
  }
  .module-card:active{transform:scale(.96); transition-duration:.1s;}
  .module-num{
    width:34px; height:34px; border-radius:50%; background:var(--navy); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; font-weight:800; font-size:14px;
  }
  .module-card h3{font-size:16.5px; line-height:1.25;}
  .module-progress{font-size:12px; color:var(--muted); font-family:'Poppins',sans-serif; font-weight:600;}
  .progress-bar{height:5px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:2px;}
  .progress-fill{height:100%; background:var(--green); border-radius:99px;}

  /* ---- Week list ---- */
  .week-list{display:flex; flex-direction:column; gap:10px;}
  .week-row{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px;
    display:flex; align-items:center; gap:14px; text-align:left; width:100%; transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .week-row:active{transform:scale(.97); transition-duration:.1s;}
  .week-badge{
    width:38px; height:38px; border-radius:50%; background:var(--cream); border:2px solid var(--blue); color:var(--navy);
    display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; font-weight:800; font-size:14px; flex:0 0 auto;
  }
  .week-row.showcase .week-badge{background:var(--orange); border-color:var(--orange); color:var(--white);}
  .week-info{flex:1; min-width:0;}
  .week-info h3{font-size:16px; margin-bottom:2px;}
  .week-info p{font-size:12.5px; color:var(--muted); font-family:'Poppins',sans-serif; font-weight:600;}
  .week-arrow{color:var(--muted); font-size:18px;}

  /* ---- Class detail ---- */
  .section-block{margin-bottom:26px;}
  .section-label{
    font-family:'Poppins',sans-serif; font-weight:700; font-size:13px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--white); background:var(--navy); display:inline-block; padding:6px 14px; border-radius:999px; margin-bottom:12px;
  }
  .info-card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:10px;}
  .info-card .k{font-family:'Poppins',sans-serif; font-weight:700; font-size:12px; color:var(--blue); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .info-card .v{font-size:14.5px; line-height:1.5;}
  .info-card .v ul{padding-left:2px; display:flex; flex-direction:column; gap:4px; margin-top:2px;}
  .info-card .v li::before{content:"\2022 "; color:var(--orange);}

  .exercise-card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:14px;}
  .exercise-head{padding:14px 16px 12px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .exercise-pillar{font-family:'Poppins',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--blue); margin-bottom:3px;}
  .exercise-name{font-family:'Poppins',sans-serif; font-weight:700; font-size:15.5px; color:var(--navy); line-height:1.3;}
  .exercise-detail{font-size:13px; color:var(--muted); margin-top:3px; line-height:1.45;}
  .exercise-cue{font-size:13px; color:var(--ink); font-style:italic; margin-top:6px;}
  .video-wrap{position:relative; width:100%; max-width:380px; margin:0 auto; aspect-ratio:9/16; background:#0d1f3a;}
  .video-wrap iframe{width:100%; height:100%; border:0; display:block;}
  .video-missing{
    width:100%; max-width:380px; margin:0 auto; aspect-ratio:9/16; background:repeating-linear-gradient(135deg, #f1ebe3, #f1ebe3 10px, #ebe3d8 10px, #ebe3d8 20px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted);
  }
  .video-missing .icon{font-size:22px;}
  .video-missing span{font-family:'Poppins',sans-serif; font-weight:600; font-size:12.5px;}

  .habit-card{background:var(--navy); border-radius:var(--radius-lg); padding:20px 20px; color:var(--white);}
  .habit-card .k{font-family:'Poppins',sans-serif; font-weight:700; font-size:12px; color:var(--green); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;}
  .habit-card h3{color:var(--white); font-size:17px; margin-bottom:10px;}
  .habit-card .v{font-size:14px; line-height:1.55; color:rgba(255,245,236,.88); margin-bottom:12px;}
  .habit-card .v:last-child{margin-bottom:0;}
  .habit-card ul{display:flex; flex-direction:column; gap:5px;}
  .habit-card li::before{content:"\2022 "; color:var(--green);}

  /* ---- Healthy Habits Lesson (rich) ---- */
  .lesson-card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px 18px 16px;}
  .lesson-arc{margin-bottom:6px;}
  .lesson-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px;}
  .lesson-vocab-badge{font-family:'Poppins',sans-serif; font-weight:700; font-size:11.5px; color:var(--white); background:var(--blue); padding:4px 11px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;}
  .lesson-duration{font-family:'Poppins',sans-serif; font-weight:600; font-size:12px; color:var(--muted);}
  .lesson-title{font-size:17.5px; margin-bottom:12px; line-height:1.3;}
  .lesson-script-label{font-family:'Poppins',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--orange); margin-bottom:6px;}
  .lesson-script{background:var(--cream); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:14px;}
  .lesson-script p{font-size:14.5px; line-height:1.6; color:var(--ink); margin-bottom:10px;}
  .lesson-script p:last-child{margin-bottom:0;}
  .lesson-takeaway, .lesson-challenge{margin-bottom:12px;}
  .lesson-takeaway .k, .lesson-challenge .k{font-family:'Poppins',sans-serif; font-weight:700; font-size:11.5px; color:var(--blue); text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
  .lesson-takeaway .v{font-size:14.5px; line-height:1.5; font-style:italic; color:var(--navy); font-weight:600;}
  .lesson-challenge .v{font-size:14px; line-height:1.5; color:var(--ink);}
  .lesson-more{border-top:1px solid var(--line); padding-top:12px; margin-top:2px;}
  .lesson-more summary{font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; color:var(--navy); cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; padding:4px 0; transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
  .lesson-more summary:active{transform:scale(.98);}
  .lesson-more summary::-webkit-details-marker{display:none;}
  .lesson-more summary::after{content:"+"; font-size:19px; color:var(--blue); line-height:1; transition:transform .2s ease;}
  .lesson-more[open] summary::after{transform:rotate(45deg);}
  .lesson-more-body{padding-top:10px;}
  .lesson-more-body .k{font-family:'Poppins',sans-serif; font-weight:700; font-size:11.5px; color:var(--blue); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 4px;}
  .lesson-more-body .k:first-child{margin-top:0;}
  .lesson-more-body p{font-size:14px; line-height:1.55; color:var(--ink);}
  .lesson-more-body ul{display:flex; flex-direction:column; gap:6px;}
  .lesson-more-body li{font-size:14px; line-height:1.5; color:var(--ink); padding-left:14px; position:relative;}
  .lesson-more-body li::before{content:"\2022"; color:var(--orange); position:absolute; left:0;}

  /* ---- Module Vocabulary ---- */
  .vocab-grid{display:flex; flex-direction:column; gap:10px;}
  .vocab-item{padding-bottom:10px; border-bottom:1px solid var(--line);}
  .vocab-item:last-child{border-bottom:none; padding-bottom:0;}
  .vocab-word{display:block; font-family:'Poppins',sans-serif; font-weight:700; font-size:14px; color:var(--navy); margin-bottom:2px;}
  .vocab-def{display:block; font-size:13.5px; color:var(--muted); line-height:1.45;}

  .back-btn{
    display:inline-flex; align-items:center; gap:6px; font-family:'Poppins',sans-serif; font-weight:600; font-size:13.5px;
    color:var(--navy); background:var(--white); border:1.5px solid var(--line); border-radius:999px; padding:9px 16px; margin-bottom:16px;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .back-btn:active{background:var(--cream); transform:scale(.95); transition-duration:.1s;}

  .empty{text-align:center; padding:60px 20px; color:var(--muted);}

  @media (min-width:640px){
    .module-grid{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>

<script id="coach-data" type="application/json">{"modules":[{"number":1,"title":"Movement Foundations","essentialQuestion":"How does my body move?","weeks":[{"week":1,"name":"Squat","objective":"Today we are learning how to squat safely and confidently.","whyMatters":"A squat is how we safely sit down, stand up, pick things up, and build strong legs \u2014 the foundation for confident, safe movement in everyday life.","vocab":{"word":"Squat","kidDef":"A squat is how we bend our knees and hips to sit down and stand back up.","coachDef":"Hips back like sitting in a chair; heels down, chest tall, knees tracking over toes."},"equipment":["Bean bags","Balance tape","Low boxes","Cones","Stopwatch","Foam pads (optional)"],"stretch":{"list":["Butterfly Stretch","Straddle Reach","Pike Nose-to-Knee","Figure 4 Stretch","Deep Squat Toe Grab"],"cue":"\u201cLet's wake up our hips!\u201d"},"warmup":{"theme":"Frog Jumps","movement":"Children move around the room pretending to be frogs. Focus: soft landing, bent knees, eyes forward.","cue":"\u201cQuiet frogs land softly!\u201d"},"assessment":{"name":"Timed Squat Hold","purpose":"Measure lower-body strength, balance, posture, and confidence.","how":"Children hold the bottom of a comfortable squat, keeping heels down, chest tall, eyes forward. Record hold time."},"circuit":[{"pillar":"Skill","exercise":"Bean Bag Squats","detail":"squat to pick up bean bags and place into a bucket.","cue":"\u201cSit back like you're sitting in a chair.\u201d"},{"pillar":"Balance","exercise":"Single Leg Balance Block","detail":"walk heel-to-toe along taped zigzag lines (progression: carry a bean bag).","cue":"\u201cSlow feet win.\u201d"},{"pillar":"Discipline","exercise":"Box Squats","detail":"sit lightly on a box, pause, stand back up.","cue":"\u201cDon't plop \u2014 control the whole movement.\u201d"},{"pillar":"Grit","exercise":"Squat Hold Challenge","detail":"see how long you can hold a strong squat (partner cheer variation).","cue":"\u201cStrong bodies don't quit.\u201d"},{"pillar":"Determination","exercise":"Bean Bag Rescue Relay","detail":"teams squat to collect bean bags one at a time.","cue":"\u201cOne more trip!\u201d"},{"pillar":"Control","exercise":"Slow Motion Squats","detail":"count to 5 lowering, count to 5 standing.","cue":"\u201cMove like you're underwater.\u201d"},{"pillar":"Mobility","exercise":"Deep Squat Exploration","detail":"hold deepest comfortable squat, reach overhead and side to side.","cue":"\u201cCan you stay balanced while exploring?\u201d"},{"pillar":"Focus","exercise":"Frog Freeze","detail":"frog jump around the room, freeze into a squat on command.","cue":"\u201cListening makes us faster.\u201d"}],"teamChallenge":{"name":"","equipment":"","setup":"","tips":""},"coolDown":{"theme":"Lazy Frog","breathing":"Children lie on their backs and take slow breaths.","reflection":"Finish in butterfly stretch. Coach cue: \u201cOur frogs are resting after a big day.\u201d"},"healthyHabit":{"topic":"Why Do We Exercise?","goal":"Exercise helps us become stronger, healthier, happier, and better able to help others.","story":"Imagine your body is like a superhero's toolbox. Every time you move, you put another useful tool inside. Strong legs help you climb. Strong arms help you carry. A strong heart helps you play longer. The more you move, the more tools your body has.","questions":["What makes you feel strong?","Did moving today make you feel happy?","What's one way you can help someone this week?"],"mission":"Help someone this week by using your strong body \u2014 carry groceries, pick up your toys, help carry laundry, or hold a door open."},"connection":["Sitting in a chair","Picking up toys","Getting into the car"],"healthyHabitsLesson":{"arc":"Why We Want to Be Strong (Weeks 1\u20134) \u2014 Step 1 of 4","title":"Why Do We Want to Be Strong?","vocabWord":"Strong","objective":"Introduce the three major reasons we take care of our bodies: to feel good, to help others, and to stay healthy for a long time. This lesson establishes the roadmap for Weeks 2\u20134.","duration":"5\u20138 minutes","script":"Today, we practiced making our bodies stronger. But why do we want to be strong?\n\nBeing strong is not only about having big muscles. A strong body helps us live a happy, helpful, and healthy life.\n\nThere are three big reasons we want to be strong.\n\nFirst, being strong helps us feel good. Moving our bodies can make us feel happy, proud, energetic, and confident. It also lets us play and spend time with our friends.\n\nSecond, being strong helps us help other people. We can carry groceries, clean up our toys, move things safely, and lend a hand when someone needs us.\n\nThird, being strong helps us stay healthy for a long time. Taking care of our bodies helps our muscles, bones, heart, lungs, and brain continue doing their jobs as we grow.\n\nLet\u2019s see if we can remember all three reasons.\n\nWe want to be strong so we can feel good, help others, and stay healthy for a long time.\n\nOver the next three weeks, we are going to explore each of those reasons. Next week, we will learn more about why exercise makes us feel good.","questions":["What is something you love doing with your strong body?","How can a strong body help another person?","What are the three reasons we want to be strong?","Can someone be strong in ways besides having big muscles?"],"takeaway":"We want to be strong so we can feel good, help others, and stay healthy for a long time.","homeChallenge":"Use your strong body to do one helpful thing at home.","coachNote":"Week 1 is the roadmap for Weeks 2\u20134. Repeat the three reasons several times and encourage the children to say them with you."}},{"week":2,"name":"Push","objective":"","whyMatters":"","vocab":{"word":"Push","kidDef":"","coachDef":""},"equipment":[],"stretch":{"list":["Cobra","Arm Circles","Arm Across Chest","Arm Overhead","Arm Behind Back Open Chest"],"cue":""},"warmup":{"theme":"Inchworm Crawl","movement":"","cue":""},"assessment":{"name":"Wall Push-ups","purpose":"","how":""},"circuit":[{"pillar":"Skill","exercise":"Push-ups","detail":"","cue":""},{"pillar":"Balance","exercise":"Cone Balance Plank","detail":"","cue":""},{"pillar":"Discipline","exercise":"Plank Transfer Foam Ball","detail":"","cue":""},{"pillar":"Grit","exercise":"Push-up, Ball Roll Under","detail":"","cue":""},{"pillar":"Determination","exercise":"Overhead March","detail":"","cue":""},{"pillar":"Control","exercise":"Hoop Steering Wheel","detail":"","cue":""},{"pillar":"Mobility","exercise":"Banded Tricep Pushdown","detail":"","cue":""},{"pillar":"Focus","exercise":"Up or Down","detail":"","cue":""}],"teamChallenge":{"name":"","equipment":"","setup":"","tips":""},"coolDown":{"theme":"Lazy Inchworm","breathing":"","reflection":""},"healthyHabit":{"topic":"How does being strong help others?","goal":["Help parents with chores","Protect yourself and other people","Strong people do important jobs"],"story":"","questions":["How do you help at home?","Did you do something helpful this week?","What is a job you have to be strong to do?"],"mission":""},"connection":[],"healthyHabitsLesson":{"arc":"Why We Want to Be Strong (Weeks 1\u20134) \u2014 Step 2 of 4","title":"Why Does Exercise Make Us Feel Good?","vocabWord":"Endorphin","objective":"Explore the first reason introduced in Week 1: exercise helps us feel good physically, mentally, and socially.","duration":"5\u20138 minutes","script":"Last week, we learned three reasons we want to be strong. Who remembers one of them?\n\nWe want to feel good, help others, and stay healthy for a long time.\n\nToday, we are exploring the first reason: exercise helps us feel good.\n\nHave you ever noticed that you sometimes feel happier after running, jumping, playing, or finishing a KinetIQ class?\n\nWhen we move, our brain releases special chemicals called endorphins. Can everyone say \u2018endorphins\u2019?\n\nEndorphins are little messages that help our brain feel good. They can help us feel happier, calmer, and proud of what we accomplished.\n\nExercise also gives us a chance to spend time with our friends. We can play games, work with partners, encourage each other, and celebrate when someone learns something new.\n\nMoving also feels good because it lets us accomplish goals. Maybe you balanced longer, jumped farther, finished a difficult exercise, or kept trying when something felt hard.\n\nWhen we accomplish something, we can feel proud. It does not have to be perfect. Trying, practicing, and improving are all things to be proud of.\n\nExercise can help our bodies feel energized, our brains feel happy, and our hearts feel proud.","questions":["How did you feel before class?","How do you feel now?","What is one thing you accomplished today?","How can we help our friends feel good during class?","What are the happy messages released by our brain called?"],"takeaway":"Moving our bodies can help us feel happy, connected, and proud.","homeChallenge":"Move or play for at least 10 minutes and tell someone how you feel afterward.","coachNote":"Younger children may not remember the word \u201cendorphin\u201d immediately. The goal is exposure and association, not memorizing a scientific definition."}},{"week":3,"name":"Hinge","objective":"","whyMatters":"","vocab":{"word":"Hinge","kidDef":"","coachDef":""},"equipment":[],"stretch":{"list":["Butterfly","Straddle Toe Grab","Pike Nose to Knee","Figure 4","Grab Toe Deep Squat"],"cue":""},"warmup":{"theme":"Crab Crawl","movement":"","cue":""},"assessment":{"name":"Cone Hinge Tap","purpose":"","how":""},"circuit":[{"pillar":"Skill","exercise":"Hinge Pick Up","detail":"","cue":""},{"pillar":"Balance","exercise":"Single Straight Leg Toe Touch","detail":"","cue":""},{"pillar":"Discipline","exercise":"Robot Hinge","detail":"","cue":""},{"pillar":"Grit","exercise":"Bridge Ball Pass","detail":"","cue":""},{"pillar":"Determination","exercise":"Hurdle Hops","detail":"","cue":""},{"pillar":"Control","exercise":"Ball Between Feet Hop","detail":"","cue":""},{"pillar":"Mobility","exercise":"Bean Bag Kick Over","detail":"","cue":""},{"pillar":"Focus","exercise":"High or Low","detail":"","cue":""}],"teamChallenge":{"name":"","equipment":"","setup":"","tips":""},"coolDown":{"theme":"Lazy Crab","breathing":"","reflection":""},"healthyHabit":{"topic":"How does exercise make you happy?","goal":["Endorphins make your brain happy","Get to see your friends","Get to get better at doing something hard"],"story":"","questions":["What station today was your favorite?","What is something you do that makes you happy?","What movement can you do this week that makes you happy?"],"mission":""},"connection":[],"healthyHabitsLesson":{"arc":"Why We Want to Be Strong (Weeks 1\u20134) \u2014 Step 3 of 4","title":"How Does Exercise Help Us Help Others?","vocabWord":"Capable","objective":"Explore the second reason introduced in Week 1: strong bodies allow us to be more capable and helpful.","duration":"5\u20138 minutes","script":"During Week 1, we learned three reasons we want to be strong. Last week, we talked about how exercise helps us feel good.\n\nToday, we are exploring the second reason: being strong helps us help other people.\n\nOur vocabulary word is capable. Can everyone say \u2018capable\u2019?\n\nCapable means that you are able to do something.\n\nWhen we practice moving, carrying, balancing, lifting, and controlling our bodies, we become more capable. Things that once felt difficult may begin to feel easier.\n\nA capable body can help carry groceries, put away toys, move a chair with permission, carry a backpack, help in the yard, or bring something to a family member.\n\nBeing capable does not mean we should lift everything by ourselves. Strong people also know when something is too heavy or unsafe. Asking an adult for help is a strong and smart choice.\n\nStrength is not only for ourselves. We can use what our bodies can do to make someone else\u2019s day a little easier.\n\nYou do not have to do something enormous to be helpful. Small actions count too.\n\nMaybe you hold a door, carry something light, clean your room, help a younger sibling, or ask someone, \u2018How can I help?\u2019\n\nA strong body gives us more ways to be helpful, but choosing to help is what makes that strength meaningful.","questions":["What does capable mean?","What is something you can do now that used to feel difficult?","What is one job you can safely help with at home?","When should we ask an adult for help?","What is one way you can be helpful this week?"],"takeaway":"We build capable bodies so we can help ourselves and others.","homeChallenge":"Ask someone at home, \u201cWhat is one thing I can help you with?\u201d","coachNote":"Avoid suggesting that children lift heavy or unsafe objects. Reinforce that knowing when to ask for help is part of being capable."}},{"week":4,"name":"Pull","objective":"","whyMatters":"","vocab":{"word":"Pull","kidDef":"","coachDef":""},"equipment":[],"stretch":{"list":["Cobra","Arm Circles","Arm Across Chest","Arm Overhead","Arm Behind Back Open Chest"],"cue":""},"warmup":{"theme":"Seal Crawl","movement":"","cue":""},"assessment":{"name":"Band Pulls","purpose":"","how":""},"circuit":[{"pillar":"Skill","exercise":"Band Pull-Aparts","detail":"","cue":""},{"pillar":"Balance","exercise":"Ball Balance","detail":"","cue":""},{"pillar":"Discipline","exercise":"Waiter Carry","detail":"","cue":""},{"pillar":"Grit","exercise":"Bean Bag Curls","detail":"","cue":""},{"pillar":"Determination","exercise":"Banded Rows","detail":"","cue":""},{"pillar":"Control","exercise":"Bent Over Fly","detail":"","cue":""},{"pillar":"Mobility","exercise":"Cat Cow","detail":"","cue":""},{"pillar":"Focus","exercise":"Superman Squeeze","detail":"","cue":""}],"teamChallenge":{"name":"","equipment":"","setup":"","tips":""},"coolDown":{"theme":"Lazy Seal","breathing":"","reflection":""},"healthyHabit":{"topic":"Why does exercise help us have more time for adventures?","goal":["Strong bones","Heart and lungs work better","Ability to do things like climb, jump, etc."],"story":"","questions":["What's an adventure you want to go on?","What's one reason you want to be strong?","What's an adventure you can have this week?"],"mission":""},"connection":[],"healthyHabitsLesson":{"arc":"Why We Want to Be Strong (Weeks 1\u20134) \u2014 Step 4 of 4","title":"How Does Exercise Help Us Live a Long, Healthy Life?","vocabWord":"Habit","objective":"Explore the third reason introduced in Week 1: movement supports long-term physical and mental health. Introduce the idea that healthy habits are built through repetition.","duration":"5\u20138 minutes","script":"Over the last few weeks, we have been learning why we want to be strong.\n\nWe learned that exercise can help us feel good. We learned that strong, capable bodies can help us help other people.\n\nToday, we are exploring the third reason: exercise helps us stay healthy for a long time.\n\nOur vocabulary word is habit. A habit is something we do regularly until it becomes a normal part of our life.\n\nBrushing your teeth can be a habit. Washing your hands can be a habit. Putting away your toys can be a habit. Moving your body can become a habit too.\n\nWhen we exercise, we take care of many parts of our body.\n\nOur muscles help us move and carry things.\n\nOur bones support our bodies.\n\nOur heart pumps blood throughout our body.\n\nOur lungs help us breathe.\n\nOur brain helps us think, learn, focus, and manage our feelings.\n\nWe do not exercise once and stay strong forever. We take care of our bodies again and again.\n\nThat is why learning to enjoy movement while you are young is so valuable. You are practicing a habit that can stay with you as you grow.\n\nExercise cannot promise that we will never get sick or hurt, but it is one important way we can care for the body we have.\n\nA healthy life is built from many small choices repeated over time.","questions":["What is a habit?","What is one healthy habit you already practice?","Which parts of the body does exercise help?","Why do we need to exercise more than once?","What were the three reasons from Week 1?"],"takeaway":"Healthy choices become healthy habits when we practice them again and again.","homeChallenge":"Choose one way to move your body this week and do it with a family member.","coachNote":"This completes the first four-week arc. Briefly review Weeks 1\u20134 before transitioning into Week 5\u2019s question: How do we build a strong body?"}},{"week":5,"name":"Lunge","objective":"","whyMatters":"","vocab":{"word":"Lunge","kidDef":"","coachDef":""},"equipment":[],"stretch":{"list":["Butterfly","Straddle Toe Grab","Pike Nose to Knee","Figure 4","Back-and-Forth Low Lunge"],"cue":""},"warmup":{"theme":"Duck Walk","movement":"","cue":""},"assessment":{"name":"Split Stance Hold","purpose":"","how":""},"circuit":[{"pillar":"Skill","exercise":"Lunges","detail":"","cue":""},{"pillar":"Balance","exercise":"Flamingo Walk","detail":"","cue":""},{"pillar":"Discipline","exercise":"Reverse Lunge","detail":"","cue":""},{"pillar":"Grit","exercise":"Side Lunge","detail":"","cue":""},{"pillar":"Determination","exercise":"Stepping Stones","detail":"","cue":""},{"pillar":"Control","exercise":"Lunge Hold","detail":"","cue":""},{"pillar":"Mobility","exercise":"Side Lunges","detail":"","cue":""},{"pillar":"Focus","exercise":"Left, Right, Forward, or Back Lunge","detail":"","cue":""}],"teamChallenge":{"name":"","equipment":"","setup":"","tips":""},"coolDown":{"theme":"Lazy Duck","breathing":"","reflection":""},"healthyHabit":{"topic":"How do we become strong?","goal":["Exercise and moving your body","Eating plenty of food","Rest and recovery"],"story":"","questions":["What exercise makes you feel strong?","What's your favorite food?","What is your bedtime?"],"mission":""},"connection":[],"healthyHabitsLesson":{"arc":"How We Build a Strong Body (Weeks 5\u20138) \u2014 Step 1 of 4","title":"What Builds a Strong Body?","vocabWord":"Train","objective":"Introduce the three parts of building a strong body: exercise, food, and rest. This lesson establishes the roadmap for Weeks 6\u20138.","duration":"5\u20138 minutes","script":"For the first four weeks, we answered the question: Why do we want to be strong?\n\nWe want to feel good, help others, and stay healthy for a long time.\n\nNow we are beginning a new question: How do we build a strong body?\n\nThere are three important parts: exercise, food, and rest.\n\nThink of them as three teammates. Each teammate has a different job, but they need to work together.\n\nThe first teammate is exercise.\n\nWhen we exercise, we train our bodies. To train means to practice something so our body or brain can become better at it.\n\nWhen we squat, jump, crawl, carry, balance, and run, our bodies practice doing those things.\n\nThe second teammate is food.\n\nFood gives our bodies energy and materials to grow, move, think, and repair themselves.\n\nThe third teammate is rest.\n\nOur bodies need time to recover after working hard. Sleep and quiet rest help us recharge and prepare for what comes next.\n\nImagine that you exercised but never ate. Your body would not have enough fuel.\n\nImagine that you ate but never rested. Your body would become very tired.\n\nImagine that you rested but never moved. Your body would miss opportunities to practice and grow stronger.\n\nExercise, food, and rest each have a job. Together, they help us build a strong body.\n\nOver the next three weeks, we will learn more about each teammate. Next week, we will learn how exercise builds strength.","questions":["What are the three teammates of a strong body?","What does it mean to train?","Which teammate gives us fuel?","Which teammate helps us recover?","Can one teammate do everything alone?"],"takeaway":"A strong body needs exercise, food, and rest.","homeChallenge":"See whether you can include all three teammates in your day: move, eat nourishing food, and get ready for bed on time.","coachNote":"Week 5 is the roadmap for Weeks 6\u20138. Use the same language throughout the remaining lessons: three teammates with three different jobs."}},{"week":6,"name":"Rotate","objective":"","whyMatters":"","vocab":{"word":"Rotate","kidDef":"","coachDef":""},"equipment":[],"stretch":{"list":["Cobra","Lay Down Twist","Elbow to Knee Twist","Figure 4","Straddle Grab Feet"],"cue":""},"warmup":{"theme":"Mountain Climbers","movement":"","cue":""},"assessment":{"name":"Rotation Reach","purpose":"","how":""},"circuit":[{"pillar":"Skill","exercise":"Banded Rotations","detail":"","cue":""},{"pillar":"Balance","exercise":"Standing Knee-to-Elbow Crunches","detail":"","cue":""},{"pillar":"Discipline","exercise":"Russian Twists","detail":"","cue":""},{"pillar":"Grit","exercise":"Crab Crawl Ball Move","detail":"","cue":""},{"pillar":"Determination","exercise":"Pass Ball to Neighbor","detail":"","cue":""},{"pillar":"Control","exercise":"Balance Block Plank","detail":"","cue":""},{"pillar":"Mobility","exercise":"Body Twists","detail":"","cue":""},{"pillar":"Focus","exercise":"Wood Choppers","detail":"","cue":""}],"teamChallenge":{"name":"","equipment":"","setup":"","tips":""},"coolDown":{"theme":"Lazy Mountain Climbers","breathing":"","reflection":""},"healthyHabit":{"topic":"How does exercise make us strong?","goal":["Muscles get bigger from challenging them","Bones get tougher","Lungs and heart work better"],"story":"","questions":["Do you feel strong after your workout?","Take some deep breaths.","Show me your muscles!"],"mission":""},"connection":[],"healthyHabitsLesson":{"arc":"How We Build a Strong Body (Weeks 5\u20138) \u2014 Step 2 of 4","title":"How Does Exercise Build a Strong Body?","vocabWord":"Hypertrophy","objective":"Explore the first teammate introduced in Week 5. Explain that repeated training helps the body adapt and become more capable.","duration":"5\u20138 minutes","script":"Last week, we met the three teammates that help us build a strong body: exercise, food, and rest.\n\nToday, we are learning about the first teammate: exercise.\n\nWe also have a big vocabulary word: hypertrophy. Let\u2019s say it slowly together: hy-per-tro-phy.\n\nHypertrophy is the process of muscles growing in response to training.\n\nWhen we exercise, we give our muscles a challenge. Our muscles respond to that challenge by learning how to handle it better.\n\nThat does not happen after only one repetition. We practice movements over and over.\n\nEvery time we squat, our legs practice helping us stand, sit, jump, and land.\n\nEvery time we push, our chest, shoulders, and arms practice creating force.\n\nEvery time we carry, many parts of our body work together to help us stay strong and controlled.\n\nExercise also helps more than our muscles.\n\nRunning and jumping can help strengthen our bones.\n\nActive games challenge our heart and lungs.\n\nBalancing, crawling, and learning new movements help our brain communicate with our body.\n\nExercise teaches our body how to do hard things. Something may feel challenging when we first try it. With safe practice, our body begins to understand the movement.\n\nThat is why we train. We are teaching our bodies, one repetition at a time.","questions":["What are the three teammates from last week?","What does hypertrophy mean?","What movement became easier after you practiced it?","Which parts of our body can exercise help?","Why do we repeat exercises?"],"takeaway":"Exercise teaches our bodies to become stronger and more capable.","homeChallenge":"Teach someone at home one movement you practiced in class.","coachNote":"Keep the explanation of hypertrophy simple. Muscle growth also depends on nutrition, recovery, age, and development, which will be reinforced during Weeks 7 and 8."}},{"week":7,"name":"Carry","objective":"","whyMatters":"","vocab":{"word":"Carry","kidDef":"","coachDef":""},"equipment":[],"stretch":{"list":["Cobra","Arm Circles","Arm Across Chest","Tricep Stretch","Chest Open"],"cue":""},"warmup":{"theme":"Bear Crawl","movement":"","cue":""},"assessment":{"name":"Farmer's Carry","purpose":"","how":""},"circuit":[{"pillar":"Skill","exercise":"Farmer's Carry Relay","detail":"","cue":""},{"pillar":"Balance","exercise":"Tight Rope Walk (reactive)","detail":"","cue":""},{"pillar":"Discipline","exercise":"Waiter Carry","detail":"","cue":""},{"pillar":"Grit","exercise":"Grip Foam Ball","detail":"","cue":""},{"pillar":"Determination","exercise":"Medball Carry Relay","detail":"","cue":""},{"pillar":"Control","exercise":"Cone on Head Carry","detail":"","cue":""},{"pillar":"Mobility","exercise":"Overhead Carry","detail":"","cue":""},{"pillar":"Focus","exercise":"Traffic Light Carry","detail":"","cue":""}],"teamChallenge":{"name":"","equipment":"","setup":"","tips":""},"coolDown":{"theme":"Lazy Bear","breathing":"","reflection":""},"healthyHabit":{"topic":"How does food make you strong?","goal":["Macros are the 3 things that make up your food: carbs, fats, and proteins","Carbs give you energy","Fat makes your brain work","Protein is like building blocks that help build your muscles"],"story":"","questions":["Does anyone know what's a good carb, fat, or protein?","We want to eat meals that have all three macros.","Food like cake has carbs and fat, but no protein, so we eat it sometimes, not all the time."],"mission":""},"connection":[],"healthyHabitsLesson":{"arc":"How We Build a Strong Body (Weeks 5\u20138) \u2014 Step 3 of 4","title":"How Does Food Build a Strong Body?","vocabWord":"Macro","objective":"Explore the second teammate introduced in Week 5. Teach that carbohydrates, fats, and proteins have different but equally important jobs.","duration":"5\u20138 minutes","script":"Last week, we learned how exercise trains our bodies. Today, we are learning about the second teammate: food.\n\nFood gives our bodies energy and the materials they need to grow, move, think, and recover.\n\nOur vocabulary word is macro. Macro is short for macronutrient.\n\nThere are three macronutrients: carbohydrates, fats, and proteins.\n\nWe can think of them as three friends with three different jobs.\n\nCarbohydrates give our bodies energy. They help us run, jump, play, learn, and make it through the day.\n\nFoods with carbohydrates include fruit, rice, bread, oats, potatoes, and pasta.\n\nFats support our brains, help our bodies grow, and help us use certain vitamins.\n\nFoods with fats include avocado, seeds, nut or seed butters, olive oil, and some dairy products.\n\nProtein provides building materials that our bodies use to grow and repair tissues, including our muscles.\n\nFoods with protein include chicken, fish, meat, beans, lentils, tofu, yogurt, and other dairy products.\n\nWe need all three friends.\n\nCarbohydrates are not bad. Fats are not bad. Protein cannot do every job by itself.\n\nA strong body needs a variety of foods because different foods help us in different ways.\n\nFood is not something we have to earn through exercise. We eat because every body needs fuel, whether it is a busy day, a quiet day, or a KinetIQ day.","questions":["What are the three macronutrients?","Which macro is an important source of energy?","Which macro supports our brain and growth?","Which macro provides building materials for our body?","Why do we need different types of food?"],"takeaway":"Different foods have different jobs, and our bodies need all three macros.","homeChallenge":"During a meal, see whether you can identify a carbohydrate, a fat, or a protein. Finding all three is a bonus, not a requirement.","coachNote":"Do not label foods as \u201cgood,\u201d \u201cbad,\u201d \u201cclean,\u201d or \u201cjunk.\u201d Keep the focus on what different nutrients do and the value of variety."}}],"showcase":{"week":8,"name":"Movement IQ Showcase","stretch":{"list":["Butterfly","Straddle Toe Grab","Cobra Pose","Arm Circles","Arm Across Chest"],"cue":""},"warmup":{"theme":"","movement":"Frog Jump, Inch Worm, Crab Crawl, Seal Crawl, Duck Walk, Mountain Climber, Bear Crawl","cue":""},"test":[{"skill":"Squat","assessment":"Squat Hold"},{"skill":"Push","assessment":"Wall Push-ups"},{"skill":"Hinge","assessment":"Cone Tap"},{"skill":"Pull","assessment":"Band Pulls"},{"skill":"Lunge","assessment":"Lunge Hold"},{"skill":"Rotate","assessment":"Rotation Reach"},{"skill":"Carry","assessment":"Farmer's Carry"}],"coolDown":{"theme":"Kid's Choice","breathing":"","reflection":""},"healthyHabitsLesson":{"arc":"How We Build a Strong Body (Weeks 5\u20138) \u2014 Step 4 of 4","title":"How Does Rest Build a Strong Body?","vocabWord":"Recover","objective":"Explore the third teammate introduced in Week 5. Explain that rest and sleep support recovery, learning, growth, and future energy. Conclude the full eight-week lesson arc.","duration":"5\u20138 minutes","script":"Over the last few weeks, we have been learning about the three teammates that build a strong body.\n\nExercise trains our body.\n\nFood gives our body energy and building materials.\n\nToday, we are learning about the third teammate: rest.\n\nOur vocabulary word is recover.\n\nTo recover means to give our body time and support to return to feeling ready after working hard.\n\nDuring class, we challenge our muscles, heart, lungs, and brain. After class, our bodies need time to respond to that work.\n\nRest does not mean we are being lazy. Rest is an important part of becoming stronger.\n\nSleep is one of the best ways we recover.\n\nWhile we sleep, our bodies perform important work. Our muscles and other tissues repair. Our brain organizes some of what we learned. Our body prepares energy for the next day.\n\nThat is why we may feel slow, frustrated, or tired when we do not get enough sleep.\n\nRecovery can also include taking a break, relaxing, drinking water, eating nourishing food, or choosing gentle movement when our body feels tired.\n\nStrong people listen to their bodies. They work hard when it is time to work, and they rest when it is time to recover.\n\nNow we know both big parts of our first KinetIQ lesson series.\n\nWhy do we want to be strong?\n\nTo feel good, help others, and stay healthy for a long time.\n\nHow do we build a strong body?\n\nWith exercise, food, and rest.","questions":["What does recover mean?","What happens while we sleep?","How do you feel after a good night of sleep?","What are the three teammates of a strong body?","What are the three reasons we want to be strong?"],"takeaway":"Exercise challenges us, food supports us, and rest helps us recover.","homeChallenge":"Create a simple bedtime routine that helps your body know it is time to rest.","coachNote":"This is the final lesson in the eight-week arc. End by reviewing both sets of three: Why: feel good, help others, and stay healthy. How: exercise, food, and rest."}},"vocabulary":[{"word":"Strong","definition":"Having the physical or mental ability to handle a challenge."},{"word":"Endorphin","definition":"A chemical released by the brain that can help us feel good."},{"word":"Capable","definition":"Able to do something."},{"word":"Habit","definition":"Something we practice regularly until it becomes a normal part of our routine."},{"word":"Train","definition":"To practice so the body or brain can improve."},{"word":"Hypertrophy","definition":"The process of muscles growing in response to training."},{"word":"Macro","definition":"Short for macronutrient; carbohydrates, fats, and proteins are the nutrients our bodies need in larger amounts."},{"word":"Recover","definition":"To give the body time and support to feel ready again after activity."}]},{"number":2,"title":"Agility & Coordination","essentialQuestion":"","weeks":[{"week":1,"name":"Quick Feet","circuit":[{"pillar":"Skill","exercise":"Fast Feet Ladder","cue":""},{"pillar":"Balance","exercise":"Single-leg Cone Taps","cue":""},{"pillar":"Discipline","exercise":"Slow Ladder Walk","cue":""},{"pillar":"Grit","exercise":"30-Second Fast Feet Challenge","cue":""},{"pillar":"Determination" function normalize(name){
  return (name || "").trim().toLowerCase();
}
function findVideo(name){
  const key = normalize(name);
  for (const k in VIDEO_MAP){
    if (normalize(k) === key) return VIDEO_MAP[k];
  }
  return null;
}

function countVideos(weeks){
  let total = 0, filmed = 0;
  weeks.forEach(w => (w.circuit || []).forEach(ex => {
    total++;
    if (findVideo(ex.exercise)) filmed++;
  }));
  return { total, filmed };
}

  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

function videoBlock(name){
  const id = findVideo(name);
  if (id){
    const src = `https://www.youtube-nocookie.com/embed/${esc(id)}?autoplay=1&mute=1&loop=1&playlist=${esc(id)}&controls=1&playsinline=1&rel=0&modestbranding=1`;
    return `<div class="video-wrap"><iframe src="${src}" title="${esc(name)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }
  return `<div class="video-missing"><div class="icon">\u{1F3A5}</div><span>Not filmed yet</span></div>`;
}

function exerciseCard(ex){
  return `
    <div class="exercise-card">
      ${videoBlock(ex.exercise)}
      <div class="exercise-head">
        <div>
          ${ex.pillar ? `<div class="exercise-pillar">${esc(ex.pillar)}</div>` : ""}
          <div class="exercise-name">${esc(ex.exercise)}</div>
          ${ex.detail ? `<div class="exercise-detail">${esc(ex.detail)}</div>` : ""}
          ${ex.cue ? `<div class="exercise-cue">${esc(ex.cue)}</div>` : ""}
        </div>
      </div>
    </div>`;
}

function infoCard(label, value){
  if (!value) return "";
  return `<div class="info-card"><div class="k">${esc(label)}</div><div class="v">${esc(value)}</div></div>`;
}
function infoListCard(label, items){
  if (!items || !items.length) return "";
  return `<div class="info-card"><div class="k">${esc(label)}</div><div class="v"><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div></div>`;
}

function healthyHabitsLessonBlock(lesson){
  const scriptHtml = (lesson.script || "").split(/\n\n+/).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
  const questionsHtml = (lesson.questions || []).map(q => `<li>${esc(q)}</li>`).join("");
  const hasMore = lesson.objective || questionsHtml || lesson.coachNote;
  return `
    <div class="section-block">
      <div class="section-label">Healthy Habits Lesson</div>
      <div class="lesson-card">
        ${lesson.arc ? `<div class="eyebrow lesson-arc">${esc(lesson.arc)}</div>` : ""}
        <div class="lesson-top">
          ${lesson.vocabWord ? `<span class="lesson-vocab-badge">${esc(lesson.vocabWord)}</span>` : "<span></span>"}
          ${lesson.duration ? `<span class="lesson-duration">${esc(lesson.duration)}</span>` : ""}
        </div>
        ${lesson.title ? `<h3 class="lesson-title">${esc(lesson.title)}</h3>` : ""}
        ${scriptHtml ? `<div class="lesson-script-label">Coach Script</div><div class="lesson-script">${scriptHtml}</div>` : ""}
        ${lesson.takeaway ? `<div class="lesson-takeaway"><div class="k">Movement IQ Takeaway</div><div class="v">“${esc(lesson.takeaway)}”</div></div>` : ""}
        ${lesson.homeChallenge ? `<div class="lesson-challenge"><div class="k">Home Challenge</div><div class="v">${esc(lesson.homeChallenge)}</div></div>` : ""}
        ${hasMore ? `
        <details class="lesson-more">
          <summary>Objective, Questions &amp; Coach Note</summary>
          <div class="lesson-more-body">
            ${lesson.objective ? `<div class="k">Coach Objective</div><p>${esc(lesson.objective)}</p>` : ""}
            ${questionsHtml ? `<div class="k">Interactive Questions</div><ul>${questionsHtml}</ul>` : ""}
            ${lesson.coachNote ? `<div class="k">Coach Note</div><p>${esc(lesson.coachNote)}</p>` : ""}
          </div>
        </details>` : ""}
      </div>
    </div>`;
}

// ---------------- ROUTING ----------------
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  return parts; // e.g. ["module","2","week","3"]
}

function navigate(hash){
  location.hash = hash;
}

function render(){
  const parts = parseHash();
  const app = document.getElementById('app');
  const crumb = document.getElementById('crumb');

  if (parts[0] === "module" && parts[2] === "week"){
    renderClass(app, crumb, parseInt(parts[1]), parts[3]);
  } else if (parts[0] === "module"){
    renderWeeks(app, crumb, parseInt(parts[1]));
  } else {
    renderHome(app, crumb);
  }
  window.scrollTo(0,0);
}

function renderHome(app, crumb){
  crumb.innerHTML = "";
  const cards = DATA.modules.map(m => {
    const { total, filmed } = countVideos(m.weeks);
    const pct = total ? Math.round((filmed/total)*100) : 0;
    return `
      <button class="module-card" onclick="navigate('module/${m.number}')">
        <div class="module-num">${m.number}</div>
        <h3>${esc(m.title)}</h3>
        <div class="module-progress">${filmed}/${total} exercises filmed</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </button>`;
  }).join("");

  app.innerHTML = `
    <div class="eyebrow">Coach App</div>
    <h1 class="page-title">Pick a module</h1>
    <p class="page-sub">Every class, every exercise, every video in one place.</p>
    <div class="module-grid">${cards}</div>
  `;
}

function renderWeeks(app, crumb, moduleNum){
  const m = DATA.modules.find(x => x.number === moduleNum);
  if (!m){ app.innerHTML = `<div class="empty">Module not found.</div>`; return; }

  crumb.innerHTML = `
    <button onclick="navigate('')">Modules</button>
    <span class="sep">/</span>
    <span class="current">${esc(m.title)}</span>
  `;

  const allWeeks = [...m.weeks, m.showcase];
  const rows = allWeeks.map(w => {
    const isShowcase = w === m.showcase;
    const label = isShowcase ? "Showcase" : `Week ${w.week}`;
    return `
      <button class="week-row ${isShowcase ? "showcase" : ""}" onclick="navigate('module/${moduleNum}/week/${w.week}')">
        <div class="week-badge">${isShowcase ? "\u2605" : w.week}</div>
        <div class="week-info">
          <h3>${esc(w.name)}</h3>
          <p>${esc(label)}</p>
        </div>
        <div class="week-arrow">\u203A</div>
      </button>`;
  }).join("");

  let vocabBlock = "";
  if (m.vocabulary && m.vocabulary.length){
    const items = m.vocabulary.map(v => `<div class="vocab-item"><span class="vocab-word">${esc(v.word)}</span><span class="vocab-def">${esc(v.definition)}</span></div>`).join("");
    vocabBlock = `
      <div class="section-block">
        <div class="section-label">Module Vocabulary</div>
        <div class="info-card"><div class="vocab-grid">${items}</div></div>
      </div>`;
  }

  app.innerHTML = `
    <div class="eyebrow">Module ${m.number}</div>
    <h1 class="page-title">${esc(m.title)}</h1>
    ${m.essentialQuestion ? `<p class="page-sub">${esc(m.essentialQuestion)}</p>` : `<p class="page-sub">Pick a week to see that day's full class plan.</p>`}
    <div class="week-list">${rows}</div>
    ${vocabBlock}
  `;
}

function renderClass(app, crumb, moduleNum, weekParam){
  const m = DATA.modules.find(x => x.number === moduleNum);
  if (!m){ app.innerHTML = `<div class="empty">Module not found.</div>`; return; }
  const weekNum = parseInt(weekParam);
  const isShowcase = weekNum === m.showcase.week;
  const w = isShowcase ? m.showcase : m.weeks.find(x => x.week === weekNum);
  if (!w){ app.innerHTML = `<div class="empty">Class not found.</div>`; return; }

  crumb.innerHTML = `
    <button onclick="navigate('')">Modules</button>
    <span class="sep">/</span>
    <button onclick="navigate('module/${moduleNum}')">${esc(m.title)}</button>
    <span class="sep">/</span>
    <span class="current">${isShowcase ? "Showcase" : "Week " + weekNum}</span>
  `;

  let html = `
    <div class="eyebrow">${esc(m.title)} \u2014 ${isShowcase ? "Showcase" : "Week " + weekNum}</div>
    <h1 class="page-title">${esc(w.name)}</h1>
  `;

  if (w.objective) html += `<p class="page-sub">${esc(w.objective)}</p>`;

  // Stretch
  if (w.stretch && (w.stretch.list || []).length){
    html += `<div class="section-block"><div class="section-label">Stretch</div>`;
    html += infoListCard("Movements", w.stretch.list);
    if (w.stretch.cue) html += infoCard("Coach Cue", w.stretch.cue);
    html += `</div>`;
  }

  // Warm-up
  if (w.warmup && (w.warmup.theme || w.warmup.movement)){
    html += `<div class="section-block"><div class="section-label">Warm-Up</div>`;
    if (w.warmup.theme) html += videoBlock(w.warmup.theme);
    html += infoCard("Theme", w.warmup.theme);
    html += infoCard("Movement", w.warmup.movement);
    if (w.warmup.cue) html += infoCard("Coach Cue", w.warmup.cue);
    html += `</div>`;
  }

  // Showcase test (Module 1 showcase style)
  if (w.test && w.test.length){
    html += `<div class="section-block"><div class="section-label">Movement IQ Test</div>`;
    w.test.forEach(t => { html += exerciseCard({ exercise: t.assessment, pillar: t.skill }); });
    html += `</div>`;
  }

  // Core circuit
  if (w.circuit && w.circuit.length){
    html += `<div class="section-block"><div class="section-label">Core Circuit</div>`;
    w.circuit.forEach(ex => { html += exerciseCard(ex); });
    html += `</div>`;
  }

  // Team challenge
  if (w.teamChallenge && w.teamChallenge.name){
    html += `<div class="section-block"><div class="section-label">Team Challenge</div>`;
    html += exerciseCard({ exercise: w.teamChallenge.name, detail: w.teamChallenge.setup, pillar: "" });
    if (w.teamChallenge.tips) html += infoCard("Coaching Tips", w.teamChallenge.tips);
    html += `</div>`;
  }

  // Cool down
  if (w.coolDown && (w.coolDown.theme || w.coolDown.reflection)){
    html += `<div class="section-block"><div class="section-label">Cool Down</div>`;
    html += exerciseCard({ exercise: w.coolDown.theme, detail: w.coolDown.reflection || w.coolDown.breathing, pillar: "" });
    html += `</div>`;
  }

  // Healthy Habits Lesson (rich version, falls back to the legacy summary card)
  if (w.healthyHabitsLesson){
    html += healthyHabitsLessonBlock(w.healthyHabitsLesson);
  } else if (w.healthyHabit && (w.healthyHabit.topic || (w.healthyHabit.goal||[]).length)){
    const hh = w.healthyHabit;
    html += `<div class="section-block"><div class="habit-card">`;
    html += `<div class="k">Healthy Habit Lesson</div>`;
    if (hh.topic) html += `<h3>${esc(hh.topic)}</h3>`;
    if (Array.isArray(hh.goal) && hh.goal.length) html += `<div class="v"><ul>${hh.goal.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></div>`;
    else if (hh.goal) html += `<div class="v">${esc(hh.goal)}</div>`;
    if (hh.story) html += `<div class="v">${esc(hh.story)}</div>`;
    if (hh.mission) html += `<div class="v"><strong>Mission:</strong> ${esc(hh.mission)}</div>`;
    html += `</div></div>`;
  }

  html += `<button class="back-btn" onclick="navigate('module/${moduleNum}')">\u2039 Back to ${esc(m.title)}</button>`;

  app.innerHTML = html;
}

window.addEventListener('hashchange', render);
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
